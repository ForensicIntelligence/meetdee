name: Dee
options:
  bundleIdPrefix: ca.forensicintelligence
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"

packages:
  DeeKit:
    path: Packages/DeeKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: PATM9DNCLA
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Dee:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      # Opening splash: the Forensic Intelligence block reveal (black background).
      - path: "Fi Block Bounce Reveal.mp4"
        buildPhase: resources
    dependencies:
      - package: DeeKit
        product: DeeCore
      - package: DeeKit
        product: DeeFace
      - package: DeeKit
        product: DeeVoice
      - package: DeeKit
        product: DeeTools
      - package: DeeKit
        product: DeeSense
      - package: DeeKit
        product: DeeMind
      - package: DeeKit
        product: DeeMemory
      - package: DeeKit
        product: DeeSelf
      - package: DeeKit
        product: DeeRealtime
      - package: DeeKit
        product: DeeBrain
      - package: DeeKit
        product: DeeWake
      - package: DeeKit
        product: DeeLocal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.forensicintelligence.dee
        PRODUCT_NAME: Dee
        MARKETING_VERSION: "0.6.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Dee.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Dee
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Dee listens on this iPhone for your companion's wake phrase (like “Hey Mira”, or the one you chose). Listening for it happens only on the device and never leaves the phone. Once Dee wakes, what the microphone hears during that conversation goes to the AI service you chose in setup (OpenAI, or your own server on your network) until the conversation ends. Sounds such as laughter or a doorbell are also recognised on this device."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Dee can read and add calendar events when you talk about your plans. To answer, Dee looks at up to two weeks of your calendar, and the titles and times of up to 8 events found go to the AI service you chose (OpenAI or your own server) so Dee can tell you."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Dee can read and add reminders when you talk about your to-dos. To answer, the titles of up to 10 of your open reminders go to the AI service you chose (OpenAI or your own server) so Dee can tell you."
        INFOPLIST_KEY_NSContactsUsageDescription: "Dee can look up a contact's phone, email or birthday when you ask. The contact you ask about goes to the AI service you chose (OpenAI or your own server) so Dee can tell you."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Dee can tell you roughly where you are (town and area) when you ask. That place name goes to the AI service you chose (OpenAI or your own server) so Dee can say it."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Dee hears the wake phrase with Apple's speech recognition on this iPhone only — nothing is sent anywhere to listen for it. If you choose “on this iPhone” for hearing, your words in a conversation are transcribed on the device too."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Dee connects to the AI server you set up on your home network (for example Ollama or LM Studio on your Mac), if you choose one. Dee talks only to the address you enter."
        INFOPLIST_KEY_NSCameraUsageDescription: "Dee uses the cameras to see you and the things around you: the eyes follow your face, friends you have introduced are recognised, and Dee gets curious about what is in view. Video is processed on this device and is never recorded or sent anywhere; only a few words about what Dee notices (\"a cup you are showing\") go to the AI service you chose during a conversation so Dee can talk about it."

  DeeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Dee
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Dee
        PRODUCT_BUNDLE_IDENTIFIER: ca.forensicintelligence.dee.uitests

schemes:
  Dee:
    build:
      targets:
        Dee: all
        DeeUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DeeUITests
