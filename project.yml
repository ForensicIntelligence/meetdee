name: Dee
options:
  bundleIdPrefix: ca.forensicintelligence
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"

packages:
  DeeKit:
    path: Packages/DeeKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: PATM9DNCLA
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Dee:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: App/Settings.bundle
        buildPhase: resources
      # Opening splash: the Forensic Intelligence block reveal (black background).
      - path: "Fi Block Bounce Reveal.mp4"
        buildPhase: resources
    dependencies:
      - package: DeeKit
        product: DeeCore
      - package: DeeKit
        product: DeeFace
      - package: DeeKit
        product: DeeVoice
      - package: DeeKit
        product: DeeTools
      - package: DeeKit
        product: DeeSense
      - package: DeeKit
        product: DeeMind
      - package: DeeKit
        product: DeeMemory
      - package: DeeKit
        product: DeeSelf
      - package: DeeKit
        product: DeeRealtime
      - package: DeeKit
        product: DeeBrain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.forensicintelligence.dee
        PRODUCT_NAME: Dee
        MARKETING_VERSION: "0.5.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Dee.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Dee
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Dee listens so she can talk with you. While she is open and online, everything her microphone picks up (you, anyone else nearby, the TV) is streamed to OpenAI, which understands it and answers in her voice; OpenAI may keep it for up to 30 days to check for abuse. Sounds such as laughter or a doorbell are also recognised on this device."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Dee can read and add calendar events when you talk about your plans. To answer, she looks at up to two weeks of your calendar, and the titles and times of up to 8 events she finds go to her cloud voice (OpenAI) so she can tell you."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Dee can read and add reminders when you talk about your to-dos. To answer, the titles of up to 10 of your open reminders go to her cloud voice (OpenAI) so she can tell you."
        INFOPLIST_KEY_NSContactsUsageDescription: "Dee can look up a contact's phone, email or birthday when you ask her to. The contact you ask about goes to her cloud voice (OpenAI) so she can tell you."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Dee can tell you roughly where you are (town and area) when you ask. That place name goes to her cloud voice (OpenAI) so she can say it."
        INFOPLIST_KEY_NSCameraUsageDescription: "Dee uses the cameras to see you and the things around you: her eyes follow your face, she recognises friends she has met, and she gets curious about what she sees. Video is processed on this device and is never recorded or sent anywhere; only a few words about what she notices (\"a cup you are showing her\") go to her cloud voice so she can talk about it."

  DeeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Dee
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Dee
        PRODUCT_BUNDLE_IDENTIFIER: ca.forensicintelligence.dee.uitests

schemes:
  Dee:
    build:
      targets:
        Dee: all
        DeeUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DeeUITests
