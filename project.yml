name: Dee
options:
  bundleIdPrefix: ca.forensicintelligence
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"

packages:
  DeeKit:
    path: Packages/DeeKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: PATM9DNCLA
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Dee:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: App/Settings.bundle
        buildPhase: resources
      # The model ships inside the app bundle for development builds. 2.74 GB fits
      # under the 4 GB App Store limit; Phase 7 moves it to a Background Assets pack.
      - path: Models/Qwen3.5-4B-Q4_K_M.gguf
        buildPhase: resources
        optional: true
    dependencies:
      - package: DeeKit
        product: DeeCore
      - package: DeeKit
        product: DeeLLM
      - package: DeeKit
        product: DeeFace
      - package: DeeKit
        product: DeeVoice
      - package: DeeKit
        product: DeeTools
      - package: DeeKit
        product: DeeSense
      - package: DeeKit
        product: DeeMind
      - package: DeeKit
        product: DeeMemory
      - package: DeeKit
        product: DeeSelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.forensicintelligence.dee
        PRODUCT_NAME: Dee
        MARKETING_VERSION: "0.5.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Dee.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Dee
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Dee listens when you talk to her, and notices sounds around her. Audio is processed on this device and never leaves it."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Dee turns your speech into text on this device so she can understand you."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Dee can read and add calendar events when you ask it to."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Dee can read and add reminders when you ask it to."
        INFOPLIST_KEY_NSContactsUsageDescription: "Dee can look up a contact's details when you ask it to."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Dee can tell you where you are when you ask."
        INFOPLIST_KEY_NSCameraUsageDescription: "Dee uses the cameras to see you and the things around you: her eyes follow your face, she recognises friends she has met, and she gets curious about what she sees. Everything is processed on this device; video is never recorded or sent anywhere."

  DeeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Dee
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Dee
        PRODUCT_BUNDLE_IDENTIFIER: ca.forensicintelligence.dee.uitests

schemes:
  Dee:
    build:
      targets:
        Dee: all
        DeeUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DeeUITests
